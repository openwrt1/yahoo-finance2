name: Test and Release
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for codecov

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: deno fmt --check
      - run: deno lint

      - name: Run tests, produce coverage
        run: deno task test --coverage

      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true

      #      - name: Prepare packages for next step (remove after non-sha release)
      #        run: cd /home/runner/work/_actions/gaelgirodon/ci-badges-action && npm i -D @actions/core @actions/github @actions/glob

      #      - name: Upload coverage to gist
      #        uses: gaelgirodon/ci-badges-action@4059134f9f9e113d77dd4f05a47db8b62c09848c
      #        with:
      #          gist-id: d3d51b4f829b93d41e5d809dcf2ef03d
      #          token: ${{ secrets.GH_TOKEN_GISTS }}

      #      - name: Save runtime tests result to gist
      #        uses: exuanbo/actions-deploy-gist@v1
      #        with:
      #          token: ${{ secrets.GH_TOKEN_GISTS }}
      #          gist_id: 67c118e65298627dc0a3745a06387d88
      #          file_path: ./tests/runtimes/results.yaml
  sync-build:
    name: Sync Build to Branch
    needs: ["tests"]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: deno task build:npm

      - name: Deploy to Build Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: npm
          branch: build
          clean: true

  deploy:
    name: Deploy to VPS
    needs: ["tests"]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            # 1. 进入宝塔面板管理的正确目录
            PROXY_DIR="/www/wwwroot/web.sitepeng.dpdns.org/yahoo-finance-proxy"
            if [ ! -d "$PROXY_DIR" ]; then
              echo "❌ 错误: 找不到目录 $PROXY_DIR"
              exit 1
            fi
            cd "$PROXY_DIR"

            # 2. 同步代码
            git fetch --all
            git reset --hard origin/dev

            # 3. 配置 Deno 环境
            export DENO_INSTALL="$HOME/.deno"
            export PATH="$DENO_INSTALL/bin:$PATH"
            if ! command -v deno > /dev/null; then
              curl -fsSL https://deno.land/install.sh | sh
            fi

            # 4. 更新校验 Schema (解决核心资产报错的关键)
            deno task schema

            # 5. 重启服务
            pm2 delete yahoo-proxy-deno || true
            DENO_BIN=$(which deno)
            pm2 start my-server.ts --name yahoo-proxy-deno --interpreter="$DENO_BIN" --interpreter-args="run -A --node-modules-dir=false"
